# Trusted manual Linux validation using installed tools and persistent caches.
# Native macOS/Windows and the pinned minimum Rust toolchain remain separate gates.
variables:
  SOURCE_ARCHIVE:
    description: Absolute path to the staged git archive on the worker
    default: ''
  SOURCE_SHA256:
    description: SHA256 of the exact staged archive
    default: ''
  CHECK_TARGET:
    description: Run all, quality, test, python, javascript, or license checks
    default: all
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source
    image: bash
    commands:
      - |
        test -n "$SOURCE_ARCHIVE"
        test -n "$SOURCE_SHA256"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$SOURCE_ARCHIVE" --no-same-owner
  - name: linux
    image: bash
    depends_on: [verified-source]
    environment:
      CI_RUST_TOOLCHAIN: system
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /workspaces/ci-caches/ctypst/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      UV_CACHE_DIR: /workspaces/ci-caches/ctypst/uv
      BUN_INSTALL_CACHE_DIR: /workspaces/ci-caches/ctypst/bun
    commands:
      - mkdir -p /workspaces/ci-caches/ctypst
      - timeout --kill-after=30s 55m flock --timeout 60 /workspaces/ci-caches/ctypst/verify.lock bash scripts/ci.sh "$CHECK_TARGET"
