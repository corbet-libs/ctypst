[package]
name = "ctypst-python"
version = "0.3.2"
edition = "2024"
rust-version = "1.92"
description = "Python bindings for ctypst (embedded Typst measurement and rendering)"
license = "FSL-1.1-ALv2"
publish = false

[lib]
name = "ctypst"
crate-type = ["cdylib"]

[dependencies]
ctypst = { path = "../..", default-features = false, features = ["document-fonts", "measure", "pdf", "svg"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
