name: CI

on:
  pull_request:
    paths-ignore: ["ARCHITECTURE.md", "CHANGELOG.md", "SECURITY.md"]
  push:
    # Keep full native validation on release tags.
    tags: ['v*.*.*']
    branches: [main]
    paths-ignore: ["ARCHITECTURE.md", "CHANGELOG.md", "SECURITY.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  CI_RUST_TOOLCHAIN: 1.92.0

jobs:
  quality:
    name: Rust quality and feature boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Reuse compiled dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: quality-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run shared Rust quality and package checks
        run: bash scripts/ci.sh quality

      - name: Check license metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  portable:
    needs: quality
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      # macOS: manual/tag/release. Windows: main push plus manual/tag/release; PR uses Linux.
      matrix: >-
        ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && '{"include":[{"name":"Linux","runner":"ubuntu-24.04"},{"name":"macOS","runner":"macos-15"},{"name":"Windows","runner":"windows-2025"}]}' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) && '{"include":[{"name":"Linux","runner":"ubuntu-24.04"},{"name":"Windows","runner":"windows-2025"}]}' || '{"include":[{"name":"Linux","runner":"ubuntu-24.04"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Reuse compiled dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: tests-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run locked tests with all capabilities
        shell: bash
        run: bash scripts/ci.sh test

  python:
    needs: quality
    name: Python bindings build and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Install pinned Python with maturin
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned Python environment tooling
        run: python -m pip install 'uv==0.12.5'

      - name: Reuse compiled binding dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: bindings/python -> target
          shared-key: python-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run shared Python binding checks
        run: bash scripts/ci.sh python

  matrix:
    name: Cross-runtime measurement conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Bun release
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Run shared JavaScript and package checks
        run: bash scripts/ci.sh javascript
