name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish without overwriting artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RUSTUP_TOOLCHAIN: stable

jobs:
  prepare:
    name: Verify and prepare immutable packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bundle-sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Require the shared release driver in the immutable tag
        run: |
          if [[ ! -f scripts/release.py ]]; then
            echo 'This historic tag predates the shared release driver. Use the documented Crow Cargo artifact import; do not rewrite the tag.' >&2
            exit 1
          fi

      - name: Install current stable Rust on the hosted runner
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add --toolchain stable wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: release-linux

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install hosted WebAssembly packaging tools
        run: |
          bindgen="$(python3 - <<'PY'
          import pathlib, tomllib
          versions = {p['version'] for p in tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package'] if p['name'] == 'wasm-bindgen'}
          assert len(versions) == 1
          print(versions.pop())
          PY
          )"
          curl --fail --silent --show-error --location \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${bindgen}/wasm-bindgen-${bindgen}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/binaryen.tar.gz"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${bindgen}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/binaryen-version_124/bin" >> "$GITHUB_PATH"

      - name: Run provider-independent preparation without publication credentials
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/ctypst-release
        run: python3 scripts/release.py prepare all

      - name: Freeze prepared package bundle
        id: bundle
        run: |
          tar -C "$RUNNER_TEMP/ctypst-release" --exclude=release.lock -cf "$RUNNER_TEMP/ctypst-release.tar" .
          sha256="$(sha256sum "$RUNNER_TEMP/ctypst-release.tar" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctypst-release
          path: ${{ runner.temp }}/ctypst-release.tar
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified packages
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ctypst-release
          path: ${{ runner.temp }}

      - name: Verify the package bundle from the preparation job
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/ctypst-release.tar" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/ctypst-release"
          tar -xf "$RUNNER_TEMP/ctypst-release.tar" -C "$RUNNER_TEMP/ctypst-release"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Check for the exact existing Cargo package
        id: registry
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/ctypst-release
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py status cargo

      - name: Authenticate through configured Cargo trusted publishing
        if: steps.registry.outputs.published == 'false'
        id: trusted
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # scripts/release.py publishes Cargo, then JSR, then npm, then the GitHub
      # release, so a failing npm upload cannot block Cargo or JSR.
      - name: Publish exact packages without rebuilding or changing registry policy
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/ctypst-release
          RELEASE_CARGO_AUTH: trusted
          CARGO_REGISTRY_TOKEN: ${{ steps.trusted.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish all

      - name: Retain publication journals even after a failed or ambiguous upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctypst-publication-journals-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctypst-release/publication
          if-no-files-found: ignore
          retention-days: 90
